[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mailposture"
version = "0.1.0"
description = "Audit SPF, DMARC, DKIM, MTA-STS and DNSSEC posture for a domain"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mailposture contributors" }]
keywords = ["security", "email", "spf", "dmarc", "dkim", "dns", "doh"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.scripts]
mailposture = "mailposture.cli:main"

[project.urls]
Homepage = "https://github.com/yourname/mailposture"

[tool.setuptools]
packages = ["mailposture"]
